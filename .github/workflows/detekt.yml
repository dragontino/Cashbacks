name: Scan with Detekt

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  schedule:
     - cron: '30 14 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: Detekt scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed-files
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"

          CHANGED=$(git diff --name-only --diff-filter=AMRT "$BASE_SHA" "$HEAD_SHA" || true)

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$(echo "$CHANGED" | paste -sd, -)
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Run Detekt on changed files
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true'
        run: ./gradlew detektChanged -PdetektChangedFiles="${{ steps.changed-files.outputs.files }}" --max-workers=4

      - name: Run full Detekt
        if: github.event_name == 'push'
        run: ./gradlew detekt

      - name: Upload detekt results to GitHub
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true')
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: app/build/reports/detekt/detekt.sarif
          category: detekt

      - name: Upload Detekt report
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.changed-files.outputs.has_changes == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 7